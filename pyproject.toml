[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xaperio"
version = "0.1.0"
description = "A searchable library of openly licensed books"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "flask>=3",
    "fonttools>=4",
    "pillow>=11",
    "psycopg[binary]>=3",
    "pymupdf>=1.25",
    "pypdf>=6",
    "sentence-transformers==5.1.2",
    "transformers>=4.41,<5",
    "gunicorn>=23",
]

[project.scripts]
xaperio-index = "xaperio.indexing:main"

[tool.setuptools.packages.find]
where = ["src"]
